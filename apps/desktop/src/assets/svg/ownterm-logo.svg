<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e192e"/>
      <stop offset="50%" stop-color="#14111f"/>
      <stop offset="100%" stop-color="#0c0a13"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b9a7ff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#6750a4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d6cbff"/>
      <stop offset="50%" stop-color="#9d7aff"/>
      <stop offset="100%" stop-color="#6750a4"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#9d7aff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#9d7aff" stop-opacity="0"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#9d7aff" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background Canvas Frame -->
  <g id="logo-container" filter="url(#dropShadow)">
    <!-- Base Rounded Square -->
    <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgGrad)"/>
    <rect x="32" y="32" width="448" height="448" rx="104" stroke="url(#borderGrad)" stroke-width="4"/>

    <!-- Subtle Ambient Top Glow -->
    <ellipse cx="256" cy="140" rx="180" ry="100" fill="url(#glowGrad)"/>

    <!-- Grid / Matrix Accent Subtle Lines -->
    <path d="M128 64V448M256 64V448M384 64V448M64 128H448M64 256H448M64 384H448" stroke="#ffffff" stroke-opacity="0.025" stroke-width="1.5" stroke-dasharray="6 6"/>

    <!-- OwnTerm Monogram "O" with Terminal Prompt Fusion -->
    <g id="monogram-symbol">
      <!-- Outer Ring of "O" -->
      <path d="M256 128C185.3 128 128 185.3 128 256C128 326.7 185.3 384 256 384C326.7 384 384 326.7 384 256C384 185.3 326.7 128 256 128ZM256 336C211.8 336 176 300.2 176 256C176 211.8 211.8 176 256 176C300.2 176 336 211.8 336 256C336 300.2 300.2 336 256 336Z" fill="url(#accentGrad)"/>

      <!-- Inner Terminal Chevron ">_" inside the Monogram -->
      <path d="M224 220L256 256L224 292" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="272" y="280" width="28" height="12" rx="3" fill="#b9a7ff"/>
    </g>

    <!-- Glass Surface Highlight Bevel -->
    <path d="M136 34C78 34 34 78 34 136V220C90 190 200 170 320 180C400 186 448 160 478 136V136C478 78 434 34 376 34H136Z" fill="#ffffff" fill-opacity="0.04"/>
  </g>
</svg>
