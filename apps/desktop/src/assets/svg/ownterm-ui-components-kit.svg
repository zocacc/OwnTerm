<svg width="1280" height="960" viewBox="0 0 1280 960" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap');
      .cat-title { font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 700; fill: #b9a7ff; letter-spacing: 0.04em; text-transform: uppercase; }
      .lbl { font-family: 'Inter', sans-serif; font-size: 11px; fill: #8d8a9d; font-weight: 500; }
      .item-text { font-family: 'Inter', sans-serif; font-size: 12px; fill: #f4f2f8; font-weight: 500; }
    </style>
    <linearGradient id="kitPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b9a7ff"/>
      <stop offset="100%" stop-color="#9d7aff"/>
    </linearGradient>
    <linearGradient id="kitTabActive" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1a2f"/>
      <stop offset="100%" stop-color="#111016"/>
    </linearGradient>
  </defs>

  <!-- Base Canvas for Component Kit -->
  <rect width="1280" height="960" rx="16" fill="#0f0d17"/>
  <rect x="0.5" y="0.5" width="1279" height="959" rx="15.5" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- Main Title -->
  <g transform="translate(48, 48)">
    <rect width="32" height="32" rx="8" fill="url(#kitPrimary)"/>
    <text x="16" y="21" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold" fill="#15111f" text-anchor="middle">O</text>
    <text x="44" y="22" font-family="'Inter', sans-serif" font-size="20" font-weight="700" fill="#f4f2f8">OwnTerm Design System &amp; UI Components</text>
    <text x="44" y="40" class="lbl">Figma vector components kit for frontend development (Glass Terminal Pro)</text>
  </g>

  <!-- ================= SECTION 1: BUTTONS & CONTROLS ================= -->
  <g id="sec-buttons" transform="translate(48, 120)">
    <text x="0" y="0" class="cat-title">01. Buttons &amp; Interactive Controls</text>

    <!-- Primary Button (Default) -->
    <g id="btn-primary-default" transform="translate(0, 24)">
      <rect width="120" height="36" rx="6" fill="url(#kitPrimary)"/>
      <text x="60" y="22" class="item-text" font-weight="700" fill="#15111f" text-anchor="middle">Nova aba</text>
      <text x="60" y="52" class="lbl" text-anchor="middle">Primary (Default)</text>
    </g>

    <!-- Primary Button (Hover / Active) -->
    <g id="btn-primary-hover" transform="translate(140, 24)">
      <rect width="120" height="36" rx="6" fill="#d6cbff"/>
      <text x="60" y="22" class="item-text" font-weight="700" fill="#15111f" text-anchor="middle">Nova aba</text>
      <text x="60" y="52" class="lbl" text-anchor="middle">Primary (Hover)</text>
    </g>

    <!-- Primary Button (Disabled / Loading) -->
    <g id="btn-primary-disabled" transform="translate(280, 24)">
      <rect width="120" height="36" rx="6" fill="#9d7aff" fill-opacity="0.3"/>
      <text x="60" y="22" class="item-text" font-weight="600" fill="#8d8a9d" text-anchor="middle">Abrindo…</text>
      <text x="60" y="52" class="lbl" text-anchor="middle">Primary (Loading)</text>
    </g>

    <!-- Secondary Button -->
    <g id="btn-secondary" transform="translate(420, 24)">
      <rect width="100" height="36" rx="6" fill="#1e1a2d" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="50" y="22" class="item-text" text-anchor="middle">Copiar</text>
      <text x="50" y="52" class="lbl" text-anchor="middle">Secondary</text>
    </g>

    <!-- Ghost Button -->
    <g id="btn-ghost" transform="translate(540, 24)">
      <rect width="100" height="36" rx="6" fill="transparent"/>
      <text x="50" y="22" class="item-text" fill="#a5a1b5" text-anchor="middle">Colar</text>
      <text x="50" y="52" class="lbl" text-anchor="middle">Ghost</text>
    </g>

    <!-- Icon Action Button -->
    <g id="btn-icon" transform="translate(660, 24)">
      <rect width="36" height="36" rx="6" fill="#ffffff" fill-opacity="0.06"/>
      <path d="M18 11V25M11 18H25" stroke="#b9a7ff" stroke-width="2" stroke-linecap="round"/>
      <text x="18" y="52" class="lbl" text-anchor="middle">Icon</text>
    </g>
  </g>

  <!-- ================= SECTION 2: TABS SYSTEM ================= -->
  <g id="sec-tabs" transform="translate(48, 240)">
    <text x="0" y="0" class="cat-title">02. Tab Bar Components</text>

    <!-- Active Tab Component -->
    <g id="tab-active-state" transform="translate(0, 24)">
      <path d="M0 6C0 2.68 2.68 0 6 0H186C189.32 0 192 2.68 192 6V36H0V6Z" fill="url(#kitTabActive)"/>
      <path d="M0 6C0 2.68 2.68 0 6 0H186C189.32 0 192 2.68 192 6V36" stroke="#ffffff" stroke-opacity="0.12" fill="none"/>
      <line x1="0" y1="0" x2="192" y2="0" stroke="#b9a7ff" stroke-width="2"/>

      <circle cx="18" cy="18" r="4.5" fill="#34d399"/>
      <text x="32" y="22" class="item-text" font-weight="600">PowerShell 1</text>

      <g transform="translate(164, 10)">
        <rect width="16" height="16" rx="4" fill="#ffffff" fill-opacity="0.08"/>
        <path d="M5 5L11 11M11 5L5 11" stroke="#a5a1b5" stroke-width="1.4" stroke-linecap="round"/>
      </g>
      <text x="96" y="54" class="lbl" text-anchor="middle">Active Tab</text>
    </g>

    <!-- Inactive Tab Component -->
    <g id="tab-inactive-state" transform="translate(210, 24)">
      <rect width="192" height="36" rx="6" fill="#181524" stroke="#ffffff" stroke-opacity="0.04"/>
      <circle cx="18" cy="18" r="4" fill="#8d8a9d"/>
      <text x="32" y="22" class="item-text" fill="#8d8a9d">WSL · Ubuntu</text>
      <g transform="translate(164, 10)">
        <path d="M5 5L11 11M11 5L5 11" stroke="#5a566a" stroke-width="1.4" stroke-linecap="round"/>
      </g>
      <text x="96" y="54" class="lbl" text-anchor="middle">Inactive Tab</text>
    </g>

    <!-- Hover Tab Component -->
    <g id="tab-hover-state" transform="translate(420, 24)">
      <rect width="192" height="36" rx="6" fill="#201c2e" stroke="#ffffff" stroke-opacity="0.08"/>
      <circle cx="18" cy="18" r="4" fill="#34d399"/>
      <text x="32" y="22" class="item-text" fill="#d6cbff">Command Prompt</text>
      <g transform="translate(164, 10)">
        <rect width="16" height="16" rx="4" fill="#ef4444" fill-opacity="0.2"/>
        <path d="M5 5L11 11M11 5L5 11" stroke="#ef4444" stroke-width="1.4" stroke-linecap="round"/>
      </g>
      <text x="96" y="54" class="lbl" text-anchor="middle">Hover Tab with Close</text>
    </g>
  </g>

  <!-- ================= SECTION 3: DROPDOWNS & SHELL SELECT ================= -->
  <g id="sec-dropdowns" transform="translate(48, 360)">
    <text x="0" y="0" class="cat-title">03. Dropdowns &amp; Select Menus</text>

    <!-- Closed Select -->
    <g id="select-closed" transform="translate(0, 24)">
      <rect width="240" height="36" rx="6" fill="#181524" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="14" y="22" class="item-text">PowerShell</text>
      <path d="M216 16L221 21L226 16" stroke="#8d8a9d" stroke-width="1.8" stroke-linecap="round"/>
      <text x="120" y="54" class="lbl" text-anchor="middle">Select (Closed)</text>
    </g>

    <!-- Open Dropdown Menu -->
    <g id="select-open-menu" transform="translate(260, 24)">
      <!-- Input trigger -->
      <rect width="240" height="36" rx="6" fill="#181524" stroke="#b9a7ff" stroke-width="1.5"/>
      <text x="14" y="22" class="item-text">PowerShell</text>
      <path d="M216 21L221 16L226 21" stroke="#b9a7ff" stroke-width="1.8" stroke-linecap="round"/>

      <!-- Menu Items Overlay -->
      <g transform="translate(0, 42)">
        <rect width="240" height="144" rx="8" fill="#1a1626" stroke="#ffffff" stroke-opacity="0.12" filter="drop-shadow(0 12px 24px rgba(0,0,0,0.5))"/>

        <!-- Option 1: Selected -->
        <rect x="4" y="4" width="232" height="32" rx="4" fill="#9d7aff" fill-opacity="0.15"/>
        <text x="14" y="24" class="item-text" fill="#b9a7ff" font-weight="600">PowerShell</text>
        <path d="M216 18L220 22L228 14" stroke="#b9a7ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

        <!-- Option 2 -->
        <rect x="4" y="38" width="232" height="32" rx="4" fill="transparent"/>
        <text x="14" y="58" class="item-text">Command Prompt</text>

        <!-- Option 3 -->
        <rect x="4" y="72" width="232" height="32" rx="4" fill="transparent"/>
        <text x="14" y="92" class="item-text">WSL · Ubuntu 24.04</text>

        <!-- Option 4 -->
        <rect x="4" y="106" width="232" height="32" rx="4" fill="transparent"/>
        <text x="14" y="126" class="item-text">WSL · Debian</text>
      </g>
      <text x="120" y="210" class="lbl" text-anchor="middle">Select (Open State with Options)</text>
    </g>

    <!-- Quick Search Input / Dialog -->
    <g id="input-host-search" transform="translate(540, 24)">
      <rect width="320" height="36" rx="6" fill="#181524" stroke="#ffffff" stroke-opacity="0.12"/>
      <circle cx="22" cy="18" r="5" stroke="#8d8a9d" stroke-width="1.6"/>
      <path d="M26 22L30 26" stroke="#8d8a9d" stroke-width="1.6" stroke-linecap="round"/>
      <text x="38" y="22" class="item-text" fill="#8d8a9d">Buscar hosts, grupos ou sessões…</text>
      <text x="160" y="54" class="lbl" text-anchor="middle">Quick Search / Host Filter</text>
    </g>
  </g>

  <!-- ================= SECTION 4: STATUS BADGES & NOTIFICATIONS ================= -->
  <g id="sec-badges" transform="translate(48, 620)">
    <text x="0" y="0" class="cat-title">04. Status Badges, Indicators &amp; Alerts</text>

    <!-- Pill: Connected -->
    <g transform="translate(0, 24)">
      <rect width="140" height="32" rx="16" fill="#34d399" fill-opacity="0.1" stroke="#34d399" stroke-opacity="0.3"/>
      <circle cx="16" cy="16" r="4.5" fill="#34d399"/>
      <text x="28" y="20" class="item-text" font-size="11" fill="#34d399" font-weight="600">Conectado</text>
    </g>

    <!-- Pill: Starting -->
    <g transform="translate(155, 24)">
      <rect width="140" height="32" rx="16" fill="#fbbf24" fill-opacity="0.1" stroke="#fbbf24" stroke-opacity="0.3"/>
      <circle cx="16" cy="16" r="4.5" fill="#fbbf24"/>
      <text x="28" y="20" class="item-text" font-size="11" fill="#fbbf24" font-weight="600">Iniciando…</text>
    </g>

    <!-- Pill: Exit Code Badge -->
    <g transform="translate(310, 24)">
      <rect width="160" height="32" rx="16" fill="#181524" stroke="#8d8a9d" stroke-opacity="0.3"/>
      <circle cx="16" cy="16" r="4.5" fill="#8d8a9d"/>
      <text x="28" y="20" class="item-text" font-size="11" fill="#8d8a9d" font-weight="600">Encerrado · cód 0</text>
    </g>

    <!-- Pill: Failed / Error -->
    <g transform="translate(485, 24)">
      <rect width="140" height="32" rx="16" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-opacity="0.3"/>
      <circle cx="16" cy="16" r="4.5" fill="#ef4444"/>
      <text x="28" y="20" class="item-text" font-size="11" fill="#ef4444" font-weight="600">Falhou</text>
    </g>

    <!-- Alert Banner -->
    <g id="alert-banner" transform="translate(640, 24)">
      <rect width="480" height="40" rx="8" fill="#2d151c" stroke="#ef4444" stroke-opacity="0.4"/>
      <circle cx="24" cy="20" r="7" fill="#ef4444" fill-opacity="0.2"/>
      <path d="M24 16V20M24 24H24.01" stroke="#ef4444" stroke-width="1.8" stroke-linecap="round"/>
      <text x="40" y="24" class="item-text" fill="#fca5a5" font-size="12">Não foi possível iniciar o core do OwnTerm ou abrir o shell selecionado.</text>
    </g>
  </g>

  <!-- ================= SECTION 5: COLOR & DESIGN TOKENS ================= -->
  <g id="sec-tokens" transform="translate(48, 740)">
    <text x="0" y="0" class="cat-title">05. Color Tokens &amp; Theme Variables</text>

    <!-- Token 1: Background -->
    <g transform="translate(0, 24)">
      <rect width="130" height="50" rx="8" fill="#111016" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="12" y="24" class="item-text" font-weight="bold">#111016</text>
      <text x="12" y="40" class="lbl">--background / terminal</text>
    </g>

    <!-- Token 2: Surface -->
    <g transform="translate(145, 24)">
      <rect width="130" height="50" rx="8" fill="#181524" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="12" y="24" class="item-text" font-weight="bold">#181524</text>
      <text x="12" y="40" class="lbl">--surface-solid</text>
    </g>

    <!-- Token 3: Primary -->
    <g transform="translate(290, 24)">
      <rect width="130" height="50" rx="8" fill="#9d7aff"/>
      <text x="12" y="24" class="item-text" font-weight="bold" fill="#15111f">#9D7AFF</text>
      <text x="12" y="40" class="lbl" fill="#2d1f4d">--primary</text>
    </g>

    <!-- Token 4: Primary Light -->
    <g transform="translate(435, 24)">
      <rect width="130" height="50" rx="8" fill="#b9a7ff"/>
      <text x="12" y="24" class="item-text" font-weight="bold" fill="#15111f">#B9A7FF</text>
      <text x="12" y="40" class="lbl" fill="#2d1f4d">--primary-light</text>
    </g>

    <!-- Token 5: Success -->
    <g transform="translate(580, 24)">
      <rect width="130" height="50" rx="8" fill="#34d399"/>
      <text x="12" y="24" class="item-text" font-weight="bold" fill="#064e3b">#34D399</text>
      <text x="12" y="40" class="lbl" fill="#064e3b">--status-connected</text>
    </g>

    <!-- Token 6: Warning -->
    <g transform="translate(725, 24)">
      <rect width="130" height="50" rx="8" fill="#fbbf24"/>
      <text x="12" y="24" class="item-text" font-weight="bold" fill="#78350f">#FBBF24</text>
      <text x="12" y="40" class="lbl" fill="#78350f">--status-starting</text>
    </g>

    <!-- Token 7: Danger -->
    <g transform="translate(870, 24)">
      <rect width="130" height="50" rx="8" fill="#ef4444"/>
      <text x="12" y="24" class="item-text" font-weight="bold" fill="#ffffff">#EF4444</text>
      <text x="12" y="40" class="lbl" fill="#fee2e2">--danger</text>
    </g>

    <!-- Token 8: Text Foreground -->
    <g transform="translate(1015, 24)">
      <rect width="130" height="50" rx="8" fill="#f4f2f8"/>
      <text x="12" y="24" class="item-text" font-weight="bold" fill="#15111f">#F4F2F8</text>
      <text x="12" y="40" class="lbl" fill="#6b7280">--foreground</text>
    </g>
  </g>
</svg>
