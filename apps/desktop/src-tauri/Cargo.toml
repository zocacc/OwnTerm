[package]
name = "ownterm-desktop"
version.workspace = true
description = "Desktop local-first para shells locais e SSH."
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "ownterm_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2.6.3"

[dependencies]
ownterm-application = { path = "../../../crates/ownterm-application" }
serde = { version = "1.0.229", features = ["derive"] }
tauri = "2.11.3"

[target."cfg(windows)".dependencies]
keyring = "4.2.0"
portable-pty = "0.9.0"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "time"] }
