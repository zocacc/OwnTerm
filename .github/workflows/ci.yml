name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration-policy:
    name: Integration policy
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Require develop as the source for main
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "develop" ]; then
            echo "Only pull requests from develop may target main."
            exit 1
          fi

  frontend-quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v5
        with:
          node-version: 20.20.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm format:check

  rust-quality:
    name: Rust quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-rust-1.94.1
      - name: Install Linux prerequisites for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  rust-tests:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-rust-1.94.1
      - name: Install Linux prerequisites for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: cargo test --workspace
      - run: cargo check -p ownterm-desktop

  windows-conpty:
    name: Windows ConPTY smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-rust-1.94.1
      - name: Validate PowerShell and CMD through ConPTY
        run: cargo test -p ownterm-pty-spike --test windows_pty -- --nocapture
        timeout-minutes: 2
      - name: Validate production local session manager and platform adapters
        run: cargo test -p ownterm-terminal -p ownterm-platform -- --nocapture
        timeout-minutes: 2
      - name: Validate SSH loopback fixture
        run: cargo test -p ownterm-ssh --test local_fixture -- --nocapture
        timeout-minutes: 2

  windows-build:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v5
        with:
          node-version: 20.20.2
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-rust-1.94.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ownterm/desktop tauri build --bundles nsis
      - name: Smoke install and launch generated NSIS package
        shell: pwsh
        run: |
          $installer = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not generated" }
          Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait -NoNewWindow
          $uninstallKey = Get-ChildItem "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall" -ErrorAction SilentlyContinue |
            Get-ItemProperty |
            Where-Object { $_.DisplayName -eq "OwnTerm" } |
            Select-Object -First 1
          $roots = @(
            $uninstallKey.InstallLocation,
            "$env:LOCALAPPDATA\OwnTerm",
            "$env:LOCALAPPDATA\Programs\OwnTerm",
            "$env:ProgramFiles\OwnTerm"
          ) | Where-Object { $_ -and (Test-Path $_) }
          $installed = Get-ChildItem $roots -Filter *.exe -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notmatch "uninstall" } |
            Select-Object -First 1
          if (-not $installed) { throw "No application executable was installed by the NSIS package" }
          Write-Host "Installed executable: $($installed.FullName)"
          $process = Start-Process -FilePath $installed.FullName -PassThru
          Start-Sleep -Seconds 5
          if ($process.HasExited) { throw "Installed OwnTerm executable exited before completing the launch smoke" }
          Stop-Process -Id $process.Id -Force
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        with:
          name: ownterm-windows-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
