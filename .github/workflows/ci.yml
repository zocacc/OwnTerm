name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration-policy:
    name: Integration policy
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Require develop as the source for main
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "develop" ]; then
            echo "Only pull requests from develop may target main."
            exit 1
          fi

  frontend-quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v5
        with:
          node-version: 20.20.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @ownterm/desktop exec playwright install --with-deps chromium
      - run: pnpm --filter @ownterm/desktop test:browser
      - name: Upload terminal composition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-composition-chromium
          path: apps/desktop/coverage/browser/*.png
          if-no-files-found: ignore
      - run: pnpm build
      - run: pnpm format:check

  rust-quality:
    name: Rust quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-rust-1.94.1
      - name: Install Linux prerequisites for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  rust-tests:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-rust-1.94.1
      - name: Install Linux prerequisites for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: cargo test --workspace
      - run: cargo check -p ownterm-desktop

  windows-conpty:
    name: Windows ConPTY smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-rust-1.94.1
      - name: Validate PowerShell and CMD through ConPTY
        run: cargo test -p ownterm-pty-spike --test windows_pty -- --nocapture
        timeout-minutes: 2
      - name: Validate production local session manager and platform adapters
        run: cargo test -p ownterm-terminal -p ownterm-platform -- --nocapture
        timeout-minutes: 2
      - name: Validate SSH loopback fixture
        run: cargo test -p ownterm-ssh --test local_fixture -- --nocapture
        timeout-minutes: 2

  windows-build:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v5
        with:
          node-version: 20.20.2
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-rust-1.94.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ownterm/desktop tauri build --bundles nsis
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ownterm-windows-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Smoke install and launch generated NSIS package
        shell: pwsh
        run: |
          $installer = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not generated" }
          Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait -NoNewWindow
          $uninstallKey = Get-ChildItem "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall" -ErrorAction SilentlyContinue |
            Get-ItemProperty |
            Where-Object { $_.DisplayName -eq "OwnTerm" } |
            Select-Object -First 1
          $roots = @(
            $uninstallKey.InstallLocation,
            "$env:LOCALAPPDATA\OwnTerm",
            "$env:LOCALAPPDATA\Programs\OwnTerm",
            "$env:ProgramFiles\OwnTerm"
          ) | Where-Object { $_ -and (Test-Path $_) }
          $installed = Get-ChildItem $roots -Filter *.exe -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notmatch "uninstall" } |
            Select-Object -First 1
          if (-not $installed) { throw "No application executable was installed by the NSIS package" }
          Write-Host "Installed executable: $($installed.FullName)"
          $process = Start-Process -FilePath $installed.FullName -PassThru
          Start-Sleep -Seconds 5
          if ($process.HasExited) { throw "Installed OwnTerm executable exited before completing the launch smoke" }
          Stop-Process -Id $process.Id -Force
      - name: Stage isolated transparency diagnostic
        shell: pwsh
        run: |
          $diagnosticDir = Join-Path $env:RUNNER_TEMP "ownterm-transparency"
          New-Item -ItemType Directory -Path $diagnosticDir -Force | Out-Null
          Copy-Item target/release/ownterm-desktop.exe (Join-Path $diagnosticDir "ownterm-desktop.exe")
          Copy-Item scripts/windows/Start-TransparencyTest.cmd (Join-Path $diagnosticDir "Start-TransparencyTest.cmd")
      - name: Validate native diagnostic without xterm or shell processes
        shell: pwsh
        run: |
          $diagnosticDir = Join-Path $env:RUNNER_TEMP "ownterm-transparency"
          $stderrPath = Join-Path $diagnosticDir "ci-diagnostic-stderr.log"
          $diagnostic = Start-Process -FilePath (Join-Path $diagnosticDir "ownterm-desktop.exe") -ArgumentList "--transparency-test" -RedirectStandardError $stderrPath -PassThru
          try {
            $reportLine = $null
            for ($attempt = 0; $attempt -lt 40; $attempt++) {
              if ($diagnostic.HasExited) { throw "Diagnostic exited before producing a native report" }
              $reportLine = Get-Content $stderrPath -ErrorAction SilentlyContinue | Where-Object { $_.StartsWith("[COMPOSITION-DIAG]") } | Select-Object -First 1
              if ($reportLine) { break }
              Start-Sleep -Milliseconds 500
            }
            if (-not $reportLine) { throw "No native diagnostic report was produced within 20 seconds" }
            $report = $reportLine.Substring("[COMPOSITION-DIAG]".Length) | ConvertFrom-Json
            if ($report.runtimeDecorations -ne $false) { throw "Diagnostic window is not undecorated" }
            if ($report.tauriWindowCount -ne 1) { throw "Expected exactly one Tauri window" }
            if (-not $report.configuredTransparent) { throw "Window is not configured transparent" }
            if ($null -eq $report.windows.webviewBackgroundRgba -or $report.windows.webviewBackgroundRgba[3] -ne 0) { throw "Native WebView2 background is not alpha zero" }
            $shellChildren = Get-CimInstance Win32_Process -Filter "ParentProcessId = $($diagnostic.Id)" |
              Where-Object { $_.Name -match "^(powershell|pwsh|cmd|wsl)\.exe$" }
            if ($shellChildren) { throw "No-xterm diagnostic unexpectedly started a shell" }
            $report | ConvertTo-Json -Depth 10 | Set-Content (Join-Path $diagnosticDir "ci-native-probe.json")
            Write-Host "Native configuration verified; this does not prove visually rendered Acrylic."
          } finally {
            if (-not $diagnostic.HasExited) { Stop-Process -Id $diagnostic.Id -Force }
          }
      - name: Upload isolated transparency diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: ownterm-transparency-diagnostic
          path: ${{ runner.temp }}/ownterm-transparency/
          if-no-files-found: error
          retention-days: 14
